const ph=c=>IMG[c.id];
const vz=v=>v?`transform:scale(1.7);transform-origin:${v===1?"20% 70%":"80% 40%"}`:"";
const tb=(c,i)=>`background-image:url(${IMG[c.id]});background-size:${i?"170%":"cover"};background-position:${i===1?"15% 75%":i===2?"85% 35%":"center"}`;
function art(h,v,big){const f=v===1?' transform="translate(400 0) scale(-1 1)"':'';
const z=v===2?'<circle cx="300" cy="105" r="70" fill="none" stroke="#D4B98C" stroke-opacity=".5"/><circle cx="300" cy="105" r="50" fill="none" stroke="#D4B98C" stroke-opacity=".5"/>':'';
const s=`<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 225"><defs><linearGradient id="a" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="hsl(${h},35%,24%)"/><stop offset="1" stop-color="#0A0A0A"/></linearGradient><linearGradient id="c" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#3a3a3a"/><stop offset="1" stop-color="#111"/></linearGradient></defs><rect width="400" height="225" fill="url(#a)"/><rect y="170" width="400" height="55" fill="#0A0A0A" opacity=".7"/><g${f}><path d="M45 160 Q50 128 100 120 L150 92 Q200 78 250 92 L300 118 Q355 124 362 160 Z" fill="url(#c)" stroke="#D4B98C" stroke-width="1.5"/><path d="M155 98 Q200 88 245 98 L285 118 L120 118 Z" fill="#0A0A0A" stroke="#D4B98C" stroke-opacity=".6"/><circle cx="110" cy="162" r="22" fill="#0A0A0A" stroke="#D4B98C" stroke-width="2"/><circle cx="300" cy="162" r="22" fill="#0A0A0A" stroke="#D4B98C" stroke-width="2"/></g>${z}<line x1="20" y1="185" x2="380" y2="185" stroke="#D4B98C" stroke-opacity=".4"/></svg>`;
return 'data:image/svg+xml,'+encodeURIComponent(s)}
const $=s=>document.querySelector(s);
function card(c){return `<article class="card" tabindex="0" data-id="${c.id}">${c.nw?`<span class="tag">${t('NEW')}</span>`:''}<div class="im"><img src="${ph(c)}" alt="${c.b} ${c.n}" loading="lazy"></div><div class="tx"><small>${c.b} · ${c.y}</small><h3>${c.n}</h3><div class="price">฿${fmt(c.p)}</div></div></article>`}
function bind(el){el.querySelectorAll('.card').forEach(e=>{const go=()=>openM(+e.dataset.id);e.onclick=go;e.onkeydown=ev=>{if(ev.key==='Enter')go()}})}
function renderNew(){const r=$('#newrow');r.innerHTML=C.filter(c=>c.nw).map(card).join('');bind(r)}
function opts(sel,arr,cur){sel.innerHTML=arr.map(a=>`<option value="${a[0]}">${a[1]}</option>`).join('');sel.value=cur||arr[0][0]}
function renderFilters(){const b=$('#fb').value,ty=$('#ft').value,s=$('#fs').value;
opts($('#fb'),[['all',t('all')],...[...new Set(C.map(c=>c.b))].map(x=>[x,x])],b);
opts($('#ft'),[['all',t('all')],['sedan',t('sedan')],['suv',t('suv')],['ev',t('ev')]],ty);
opts($('#fs'),[0,1,2,3].map(i=>[i,t('so'+i)]),s)}
function renderGrid(){const q=$('#q').value.toLowerCase(),b=$('#fb').value,ty=$('#ft').value,mx=+$('#fp').value,s=$('#fs').value;
$('#pv').textContent='฿'+(mx>=20000000?'20M+':fmt(mx));
let l=C.filter(c=>(c.b+' '+c.n).toLowerCase().includes(q)&&(b==='all'||c.b===b)&&(ty==='all'||c.ty===ty)&&(mx>=20000000||c.p<=mx));
if(s==1)l.sort((a,b)=>a.p-b.p);if(s==2)l.sort((a,b)=>b.p-a.p);if(s==3)l.sort((a,b)=>b.y-a.y);
const g=$('#grid');g.innerHTML=l.length?l.map(card).join(''):`<div class="empty">${t('none')}</div>`;bind(g)}
let cur=null;
function openM(id,v=0){const c=C[id];cur=c;const o=t('o_'+(c.ty)).split(';');
$('#bx').innerHTML=`<div class="gal"><div style="overflow:hidden"><img class="main" src="${ph(c)}" style="${vz(v)}" alt="${c.b} ${c.n}"></div><div class="th">${[0,1,2].map(i=>`<div class="${i===v?'a':''}" data-v="${i}" role="img" aria-label="${c.n} ${i+1}" style="${tb(c,i)}"></div>`).join('')}</div></div>
<div class="info"><button class="x" aria-label="close">&times;</button><small>${c.b}</small><h2 style="margin:0">${c.n}</h2><div class="price">฿${fmt(c.p)}</div>
<div class="sp"><div><b>${t('sp1')}</b>${c.en}</div><div><b>${t('sp2')}</b>${c.hp} ${t('hp')}</div><div><b>${t('sp3')}</b>${c.g}</div><div><b>${t('sp4')}</b>${c.y}</div><div><b>${t('sp5')}</b>${fmt(c.km)} ${t('km')}</div><div><b>${t('sp6')}</b>${t(c.ty)}</div></div>
<h3 style="font-size:20px;margin-bottom:6px">${t('op')}</h3><ul>${o.map(x=>`<li>${x}</li>`).join('')}</ul>
<button class="btn fill" id="mc">${t('b1')}</button> <a class="btn" id="mq" href="#contact">${t('b2')}</a></div>`;
$('#md').classList.add('o');document.body.style.overflow='hidden';
$('#bx .x').focus();
$('#bx').querySelectorAll('.th div').forEach(i=>i.onclick=()=>openM(id,+i.dataset.v));
$('#bx .x').onclick=closeM;
$('#mc').onclick=()=>{closeM();$('#cp').value=c.p;calc();$('#calc').scrollIntoView()};
$('#mq').onclick=()=>{closeM();$('#fmsg').value=c.b+' '+c.n}}
function closeM(){$('#md').classList.remove('o');document.body.style.overflow=''}
$('#md').onclick=e=>{if(e.target.id==='md')closeM()};
document.onkeydown=e=>{if(e.key==='Escape')closeM()};

function calc(){const P=+$('#cp').value||0,u=$('#cu').value;let d=+$('#cd').value||0;d=u==='%'?P*Math.min(d,100)/100:Math.min(d,P);
const L0=P-d,n=+$('#cm').value,r=(+$('#cr').value||0)/1200;
const m=r===0?L0/n:L0*r/(1-Math.pow(1+r,-n));
$('#mv').textContent=n;$('#rs').textContent=fmt(m);$('#dn').textContent=fmt(d);$('#ln').textContent=fmt(L0)}
['#cp','#cd','#cu','#cr','#cm'].forEach(s=>$(s).addEventListener('input',calc));

const RV=[['Khun Prapat','Porsche 911 Carrera S','รถสภาพเหมือนใหม่ ทีมงานอธิบายละเอียดและไฟแนนซ์อนุมัติไวมาก ประทับใจตั้งแต่ก้าวแรกที่เข้าโชว์รูม','The car was like new, the team explained everything and finance was approved fast. Impressed from the first step in.'],
['Khun Natcha','BMW iX xDrive50','ตัดสินใจเปลี่ยนมาใช้ EV ที่นี่ ได้ทดลองขับยาวและช่วยติดตั้งเครื่องชาร์จที่บ้านให้ด้วย','I switched to an EV here. A long test drive, and they even helped set up my home charger.'],
['Khun Somchai','Mercedes-Benz S 500 L','ขั้นตอนโอนเร็ว เอกสารครบ บริการหลังการขายดูแลดีเหมือนเป็นคนในครอบครัว','Quick transfer, complete paperwork and after-sales care that feels personal.'],
['Khun Kanokwan','Toyota Alphard','รถสวย ราคาโปร่งใส ไม่มีค่าใช้จ่ายแอบแฝง แนะนำให้เพื่อนมาแล้วหลายคน','A beautiful car with transparent pricing and no hidden costs. I have already referred several friends.']];
let ri=0,rt;
function renderRv(){const r=RV[ri];$('#rv').innerHTML=`<div class="stars" aria-label="5 stars">★★★★★</div><blockquote>“${lg==='th'?r[2]:r[3]}”</blockquote><cite>${r[0]} — ${r[1]}</cite>`}
function rvGo(d){ri=(ri+d+RV.length)%RV.length;renderRv();clearInterval(rt);rt=setInterval(()=>rvGo(1),7000)}
$('#pr').onclick=()=>rvGo(-1);$('#nx').onclick=()=>rvGo(1);

function renderFin(){$('#steps').innerHTML=[1,2,3,4].map(i=>`<div><h3>${i}. ${t('fs'+i)}</h3><p>${t('fs'+i+'d')}</p></div>`).join('');
$('#perks').innerHTML=[1,2,3].map(i=>`<div><h3>${t('pk'+i)}</h3><p>${t('pk'+i+'d')}</p></div>`).join('')}
function applyLang(){document.documentElement.lang=lg;
document.querySelectorAll('[data-i]').forEach(e=>e.textContent=t(e.dataset.i));
document.querySelectorAll('[data-ph]').forEach(e=>e.placeholder=t(e.dataset.ph));
$('#lang').textContent=lg==='th'?'EN':'TH';
renderFilters();renderNew();renderGrid();renderFin();renderRv();calc()}
$('#lang').onclick=()=>{lg=lg==='th'?'en':'th';applyLang()};
['#q','#fb','#ft','#fp','#fs'].forEach(s=>$(s).addEventListener('input',renderGrid));
$('#fm').onsubmit=e=>{e.preventDefault();$('#ok').textContent=t('okm');e.target.reset()};
$('#bg').onclick=()=>$('#lk').classList.toggle('o');
$('#lk').onclick=e=>{if(e.target.tagName==='A')$('#lk').classList.remove('o')};

$('#hbg').style.backgroundImage=`url("${art(350,0)}")`;
addEventListener('scroll',()=>{const y=scrollY;$('#nav').classList.toggle('s',y>60);if(y<innerHeight)$('#hbg').style.transform=`translateY(${y*.3}px)`},{passive:true});
const io=new IntersectionObserver(es=>es.forEach(e=>{if(e.isIntersecting){e.target.classList.add('v');io.unobserve(e.target)}}),{threshold:.08});
document.querySelectorAll('.fd').forEach(e=>io.observe(e));
applyLang();rt=setInterval(()=>rvGo(1),7000);
</script>
</body>
</html>
